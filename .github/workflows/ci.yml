name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: End-to-end smoke test of packed tarball
        run: |
          TARBALL=$(npm pack ./packages/cli | tail -n 1)
          TARBALL_PATH="$(pwd)/$TARBALL"

          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm init -y
          npm install "$TARBALL_PATH"

          npx rodo init --method-only --project demo --lang en --yes-files
          npx rodo new "First feature"
          npx rodo validate --strict
          npx rodo status --local
          npx rodo doctor
